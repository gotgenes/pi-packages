packages:
  - "packages/*"

# pi-subagents-* extension packages consume their siblings from the npm registry
# (the published tarball ships the bundled dist/public.d.ts), not via workspace
# symlinks — a symlinked sibling would resolve exports.types to the gitignored,
# unbuilt dist on a fresh checkout. Cross-package links must opt in explicitly
# with the workspace: protocol.
linkWorkspacePackages: false

# Centralize version management across all packages.
# In each package.json, use "catalog:" as the version specifier
# to pull from here (e.g. "vitest": "catalog:").
catalog:
  "@biomejs/biome": "^2.6.8"
  "eslint": "^10.15.0"
  "globals": "^17.14.0"
  "typescript-eslint": "^8.73.0"
  # Pinned exactly, not caret-ranged: rumdl's sentence-per-line reflow output
  # changes between releases, so a version bump reflows the whole repo and
  # lands as its own reviewed commit (0.2.24 -> 0.3.5 touched about 400 files).
  # Keep prek.toml's rumdl-pre-commit rev in lockstep with this pin.
  "rumdl": "0.3.5"
  # TypeScript 7 runs side by side with TypeScript 6, the setup the TS 7.0
  # release documents. TS 7 ships no compiler API, and typescript-eslint and
  # rollup-plugin-dts `require("typescript")` for one, so the name `typescript`
  # stays on TS 6 while `@typescript/native` provides TS 7's `tsc` binary
  # (TS 6's binary is `tsc6`, so they do not collide).
  "typescript": "npm:@typescript/typescript6@^6.0.2"
  "@typescript/native": "npm:typescript@^7.0.2"
  "vitest": "^5.1.1"
  # Istanbul coverage for `fallow health --coverage`, the format the fallow
  # skill's command produces (fallow also reads raw V8 coverage since 3.29.0;
  # switching is #1138). Root-only: a coverage run is `pnpm --filter
  # <pkg> exec vitest run --coverage`, so no package manifest references it.
  "@vitest/coverage-istanbul": "^5.1.1"
  "@types/node": "^22.15.3"
  fallow: "^3.46.0"
  fallow-type-aware: "^3.46.0"
  rollup: "^4.68.8"
  "rollup-plugin-dts": "^6.5.1"

allowBuilds:
  "@google/genai": true
  esbuild: false
  fallow: true
  koffi: true
  protobufjs: true
  tree-sitter-bash: true

minimumReleaseAgeExclude:
  - '@gotgenes/pi-permission-system@40.3.0'
  - '@earendil-works/pi-agent-core@1.0.0'
  - '@earendil-works/pi-ai@1.0.0'
  - '@earendil-works/pi-coding-agent@1.0.0'
  - '@earendil-works/pi-telemetry@1.0.0'
  - '@earendil-works/pi-tui@1.0.0'
  - '@earendil-works/chord@1.0.0'
  - '@earendil-works/pi-codemode@1.0.0'
  - '@earendil-works/pi-mcp@1.0.0'
  - '@rollup/rollup-android-arm-eabi@4.68.8'
  - '@rollup/rollup-android-arm64@4.68.8'
  - '@rollup/rollup-android-x64@4.68.8'
  - '@rollup/rollup-darwin-arm64@4.68.8'
  - '@rollup/rollup-darwin-x64@4.68.8'
  - '@rollup/rollup-freebsd-arm64@4.68.8'
  - '@rollup/rollup-freebsd-x64@4.68.8'
  - '@rollup/rollup-linux-arm-gnueabihf@4.68.8'
  - '@rollup/rollup-linux-arm-musleabihf@4.68.8'
  - '@rollup/rollup-linux-arm64-gnu@4.68.8'
  - '@rollup/rollup-linux-arm64-musl@4.68.8'
  - '@rollup/rollup-linux-loong64-gnu@4.68.8'
  - '@rollup/rollup-linux-loong64-musl@4.68.8'
  - '@rollup/rollup-linux-ppc64-gnu@4.68.8'
  - '@rollup/rollup-linux-ppc64-musl@4.68.8'
  - '@rollup/rollup-linux-riscv64-gnu@4.68.8'
  - '@rollup/rollup-linux-riscv64-musl@4.68.8'
  - '@rollup/rollup-linux-s390x-gnu@4.68.8'
  - '@rollup/rollup-linux-x64-gnu@4.68.8'
  - '@rollup/rollup-linux-x64-musl@4.68.8'
  - '@rollup/rollup-openbsd-x64@4.68.8'
  - '@rollup/rollup-openharmony-arm64@4.68.8'
  - '@rollup/rollup-win32-arm64-msvc@4.68.8'
  - '@rollup/rollup-win32-ia32-msvc@4.68.8'
  - '@rollup/rollup-win32-x64-gnu@4.68.8'
  - '@rollup/rollup-win32-x64-msvc@4.68.8'
  - rollup@4.68.8
  - '@fallow-cli/darwin-arm64@3.46.0'
  - '@fallow-cli/darwin-x64@3.46.0'
  - '@fallow-cli/linux-arm64-gnu@3.46.0'
  - '@fallow-cli/linux-arm64-musl@3.46.0'
  - '@fallow-cli/linux-x64-gnu@3.46.0'
  - '@fallow-cli/linux-x64-musl@3.46.0'
  - '@fallow-cli/win32-arm64-msvc@3.46.0'
  - '@fallow-cli/win32-x64-msvc@3.46.0'
  - fallow-type-aware@3.46.0
  - fallow@3.46.0

# A freshly-published first-party sibling (e.g. a same-day @gotgenes/* release a
# dependent package bumps to) cannot be unblocked via minimumReleaseAgeExclude:
# that list is honored during dependency resolution but NOT during pnpm's
# lockfile supply-chain verification pass, which re-applies minimumReleaseAge to
# every pinned lockfile entry and fails CI's frozen install. trustLockfile
# treats the committed, PR-reviewed lockfile as trusted and skips that
# re-verification, so a same-day sibling release installs immediately; the age
# delay still applies to fresh `pnpm add`/`update` resolutions.
trustLockfile: true
