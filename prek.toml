# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-added-large-files" },
]

[[repos]]
repo = "local"
hooks = [
    # Runs ahead of the formatters so a stray byte is reported where it is,
    # rather than after Biome has reflowed the line around it (Refs #960).
    { id = "invisible-characters", name = "invisible characters", entry = "node scripts/lint/invisible-characters.mjs --fix", language = "system", types = ["text"] },
    # Decodes a literal escape such as `\u2014` in markdown prose and in code
    # comments, before rumdl or Biome reflows the line around it.
    { id = "unicode-escapes", name = "unicode escapes", entry = "node scripts/lint/unicode-escapes.mjs --fix", language = "system", types_or = ["markdown", "ts", "javascript"] },
    { id = "biome", name = "biome", entry = "pnpm exec biome check --write --files-ignore-unknown=true", language = "system", types_or = ["javascript", "jsx", "ts", "tsx", "json"] },
    { id = "eslint", name = "eslint", entry = "pnpm exec eslint --fix", language = "system", types = ["ts"], files = "^packages/" },
]

[[repos]]
# Pinned in lockstep with the `rumdl` catalog entry in pnpm-workspace.yaml,
# which records why (rvben/rumdl#933).
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.24"
hooks = [
    { id = "rumdl-fmt" },
]

# Conventional Commit grammar check on the commit-msg stage. Rejects the
# malformed `type!(scope):` form (Refs #452, #457). Config: committed.toml.
[[repos]]
repo = "https://github.com/crate-ci/committed"
rev = "v1.1.11"
hooks = [
    { id = "committed" },
]
