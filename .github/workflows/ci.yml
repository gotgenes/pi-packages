name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run check

      - name: Verify public types are consumable from the package
        run: pnpm --filter @gotgenes/pi-subagents run verify:public-types

      - name: Verify pi-permission-system public types are consumable from the package
        run: pnpm --filter @gotgenes/pi-permission-system run verify:public-types

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm -r run test

      # Runs on its own, after the concurrent workspace suite. These tests spawn
      # the real `pi` CLI, and doing so alongside eight other packages' vitest
      # processes is what made them flake (#678).
      - name: Real-CLI acceptance tests (pi-autoformat)
        run: pnpm --filter @gotgenes/pi-autoformat run test:acceptance

      - name: Fallow audit
        if: github.event_name == 'pull_request'
        run: pnpm fallow audit --base origin/${{ github.base_ref }}

      - name: Fallow dead-code gate
        if: github.ref == 'refs/heads/main'
        run: pnpm fallow dead-code

      - name: Fallow full report
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: pnpm fallow

  release-please:
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ toJSON(steps.release.outputs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Full history and tags: the baseline step below resolves every
          # component's release tag to a commit and orders them by ancestry.
          fetch-depth: 0

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Caps release-please's commit walk so future runs start from the oldest
      # component's release rather than the default 500 commits back, keeping the
      # per-run API burst small on this monorepo (Refs #468, #816). The script's
      # header carries the details.
      #
      # continue-on-error: a failure here must not fail the job, because that
      # would make GitHub skip the `publish` job for an already-tagged release
      # (Refs #646). A baseline that did not advance only widens the next walk.
      - name: Advance release-please last-release-sha baseline
        if: steps.release.outputs.releases_created == 'true'
        continue-on-error: true
        run: ./scripts/advance-release-baseline.sh

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish released packages
        env:
          RELEASES: ${{ needs.release-please.outputs.releases }}
        run: ./scripts/publish-released.sh
