name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r run check

      - name: Verify public types are consumable from the package
        run: pnpm --filter @gotgenes/pi-subagents run verify:public-types

      - name: Verify pi-permission-system public types are consumable from the package
        run: pnpm --filter @gotgenes/pi-permission-system run verify:public-types

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm -r run test

      # Runs on its own, after the concurrent workspace suite. These tests spawn
      # the real `pi` CLI, and doing so alongside eight other packages' vitest
      # processes is what made them flake (#678).
      - name: Real-CLI acceptance tests (pi-autoformat)
        run: pnpm --filter @gotgenes/pi-autoformat run test:acceptance

      - name: Fallow audit
        if: github.event_name == 'pull_request'
        run: pnpm fallow audit --base origin/${{ github.base_ref }}

      - name: Fallow dead-code gate
        if: github.ref == 'refs/heads/main'
        run: pnpm fallow dead-code

      - name: Fallow full report
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: pnpm fallow

  release-please:
    needs: [check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      releases: ${{ toJSON(steps.release.outputs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          # Full history and tags: the baseline step below resolves every
          # component's release tag to a commit and orders them by ancestry.
          fetch-depth: 0

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The action creates this run's tags through the API, after the checkout
      # above, so they are absent from the local clone until fetched.
      - name: Fetch tags created by this release
        if: steps.release.outputs.releases_created == 'true'
        run: git fetch --tags --force origin

      # Advance the commit-search baseline so future runs only walk commits since
      # the oldest component's release, instead of the default 500. Keeps the
      # per-run API burst small (avoids the secondary-rate-limit "Bad credentials"
      # failures) and the run fast in this high-volume monorepo. Runs only when a
      # release was just cut; [skip ci] stops the write-back commit re-triggering.
      #
      # SHA source: scripts/release-baseline-sha.sh, which derives the floor from
      # the manifest. The release action's `<path>--sha` outputs cannot be used —
      # they report only the components that just released, which is exactly the
      # set that cannot reveal a component lagging behind them (Refs #816).
      #
      # continue-on-error: a failure here must not fail the job, because that
      # would make GitHub skip the `publish` job for an already-tagged release
      # (Refs #646). A baseline that did not advance only widens the next walk.
      - name: Advance release-please last-release-sha baseline
        if: steps.release.outputs.releases_created == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          BASELINE_SHA=$(./scripts/release-baseline-sha.sh)
          tmp=$(mktemp)
          jq --arg sha "$BASELINE_SHA" '.["last-release-sha"] = $sha' release-please-config.json > "$tmp"
          mv "$tmp" release-please-config.json
          if git diff --quiet -- release-please-config.json; then
            echo "last-release-sha already at $BASELINE_SHA."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-please-config.json
          git commit -m "chore: advance release-please last-release-sha baseline [skip ci]"
          git push origin HEAD:main

  publish:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Publish released packages
        env:
          RELEASES: ${{ needs.release-please.outputs.releases }}
        run: ./scripts/publish-released.sh
